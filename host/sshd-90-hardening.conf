# /etc/ssh/sshd_config.d/90-hardening.conf
# Ajuste AllowUsers para o seu usuário. AllowTcpForwarding fica ligado:
# o acesso às interfaces web dos *arr é por túnel SSH.
AllowUsers severino
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
AllowAgentForwarding no
