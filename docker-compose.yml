services:
  gluetun:
    image: qmcgaw/gluetun:v3
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file: .env
    environment:
      # avisa o qBittorrent sempre que a Proton entregar uma nova porta encaminhada
      VPN_PORT_FORWARDING_UP_COMMAND: /bin/sh -c 'wget -O- --retry-connrefused --post-data "json={\"listen_port\":{{PORT}}}" http://127.0.0.1:8080/api/v2/app/setPreferences 2>&1'
    ports:
      - "127.0.0.1:8080:8080"   # WebUI do qBittorrent (via gluetun)
    volumes:
      - ./gluetun:/gluetun
    networks:
      - arrnet
    restart: unless-stopped
    # sem healthcheck customizado: a imagem já traz um

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"   # killswitch: sem VPN, sem rede
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
    volumes:
      - ./qbittorrent:/config
      - ${MEDIA_ROOT}:/data
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./prowlarr:/config
    ports:
      - "127.0.0.1:9696:9696"
    networks:
      - arrnet
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./sonarr:/config
      - ${MEDIA_ROOT}:/data
    ports:
      - "127.0.0.1:8989:8989"
    networks:
      - arrnet
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./radarr:/config
      - ${MEDIA_ROOT}:/data
    ports:
      - "127.0.0.1:7878:7878"
    networks:
      - arrnet
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./bazarr:/config
      - ${MEDIA_ROOT}:/data
    ports:
      - "127.0.0.1:6767:6767"
    networks:
      - arrnet
    restart: unless-stopped

  # --- Streaming (acessível na rede local, não só no loopback) ---
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./jellyfin:/config
      - ${MEDIA_ROOT}:/data:ro   # somente leitura: Jellyfin não precisa alterar a mídia
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128   # GPU Intel (VA-API) para transcodificação
    ports:
      - "8096:8096"
    networks:
      - arrnet
    restart: unless-stopped

  seerr:   # sucessor oficial do Jellyseerr; roda como usuário 1000, não como root
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    environment:
      - TZ=${TZ}
      - PORT=5055
    volumes:
      - ./seerr:/app/config
    ports:
      - "5055:5055"
    networks:
      - arrnet
    restart: unless-stopped

networks:
  arrnet:
    driver: bridge
